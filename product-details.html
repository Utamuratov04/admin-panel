
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mebel Haqida Batafsil - Comfort</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50/50 font-sans text-slate-800">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50 backdrop-blur-md bg-white/80">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center gap-4">
            <a href="index.html" class="flex items-center justify-center w-10 h-10 bg-slate-100 hover:bg-amber-500 hover:text-white rounded-xl transition-all text-slate-700">
                <i class="fas fa-arrow-left"></i>
            </a>
            <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Katalogga qaytish</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div id="product-loading" class="text-center py-20 text-slate-400">
            <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
            <p class="font-semibold">Mebel ma'lumotlari yuklanmoqda...</p>
        </div>

        <div id="product-content" class="grid grid-cols-1 md:grid-cols-2 gap-12 bg-white p-8 md:p-12 rounded-[3rem] shadow-sm border border-slate-100 hidden">
            
            <div class="flex flex-col gap-4">
                <div class="overflow-hidden rounded-[2.5rem] aspect-[4/5] bg-slate-100 shadow-inner">
                    <img id="mebel-rasm" src="" alt="" class="w-full h-full object-cover hover:scale-105 transition-transform duration-700">
                </div>
            </div>

            <div class="flex flex-col justify-between">
                <div>
                    <span id="mebel-kategoriya" class="bg-amber-100 text-amber-700 font-black text-[10px] px-4 py-1.5 rounded-full uppercase tracking-widest inline-block mb-4"></span>
                    <h1 id="mebel-nomi" class="text-3xl md:text-4xl font-black text-slate-900 uppercase tracking-wide mb-3"></h1>
                    <p id="mebel-narxi" class="text-2xl font-black text-orange-600 mb-6"></p>
                    
                    <div class="border-t border-slate-100 pt-6">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Mahsulot haqida tavsif</h3>
                        <p id="mebel-tavsif" class="text-slate-600 leading-relaxed font-medium text-sm md:text-base mb-6"></p>
                        
                        <div class="border-t border-slate-100 pt-6">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Mahsulot galereyasi (Ranglar va burchaklar)</h3>
                            <div id="mebel-galereya" class="grid grid-cols-4 gap-3">
                                </div>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-8 mt-8">
                    <button onclick="orderMebel()" class="w-full bg-slate-900 hover:bg-amber-500 text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all shadow-xl shadow-slate-900/10 active:scale-[0.98]">
                        <i class="fas fa-shopping-bag mr-2"></i> Hozroq buyurtma berish
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="contactModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl border border-slate-100 relative">
            
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <div class="text-center mb-6">
                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest block mb-1">Buyurtma rasmiylashtirish</span>
                <h2 class="text-2xl font-black text-slate-800 uppercase">Ma'lumotlaringiz</h2>
            </div>

            <form id="feedbackForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Ismingiz</label>
                    <input type="text" id="msgName" placeholder="Ismingizni kiriting" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-semibold focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Telefon raqamingiz</label>
                    <input type="text" id="msgPhone" value="+998" placeholder="+998 __ ___ __ __" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-semibold focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Istaklaringiz (Izoh)</label>
                    <textarea id="msgText" rows="3" placeholder="Mebel o'lchami yoki rangiga oid istaklar..." class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-semibold focus:outline-none focus:border-amber-500 transition-colors resize-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all shadow-lg shadow-amber-500/20 active:scale-[0.98] mt-2">
                    <span id="btnText">Xabar yuborish</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://7da933a18628966e.mokky.dev';
        let joriyMebel = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mebelId = urlParams.get('id');

            if (!mebelId) {
                alert("Mahsulot IDsi topilmadi!");
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/mebellar/${mebelId}`);
                if (!res.ok) throw new Error("Mebel topilmadi");
                
                joriyMebel = await res.json();

                // Ma'lumotlarni HTML elementlariga yuklash
                document.getElementById('mebel-rasm').src = joriyMebel.rasm;
                document.getElementById('mebel-rasm').alt = joriyMebel.nomi;
                document.getElementById('mebel-kategoriya').innerText = joriyMebel.category || "Mebel";
                document.getElementById('mebel-nomi').innerText = joriyMebel.nomi;
                document.getElementById('mebel-narxi').innerText = joriyMebel.narxi.includes("UZS") ? joriyMebel.narxi : `${joriyMebel.narxi} UZS`;
                document.getElementById('mebel-tavsif').innerText = joriyMebel.tavsif || "Ushbu Comfort Mebel mahsuloti yuqori sifatli xomashyolardan tayyorlangan bo'lib, uyingizga o'zgacha shinamlik va go'zallik bag'ishlaydi. Kafolat muddati 2 yil.";

                // DINAMIK GALEREYA: Mokky.dev dan qo'shimcha rasmlar massivi kelsa ularni chizadi, kelmasa interyerga mos 4 ta ajoyib variantni ko'rsatadi
                const galereyaKonteyner = document.getElementById('mebel-galereya');
                const qoshimchaRasmlar = joriyMebel.rasmlar || [
                    joriyMebel.rasm,
                    'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=400',
                    'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80&w=400',
                    'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&q=80&w=400'
                ];

                galereyaKonteyner.innerHTML = qoshimchaRasmlar.slice(0, 4).map(rasmUrl => `
                    <div class="overflow-hidden rounded-xl aspect-square bg-slate-50 border border-slate-100 cursor-pointer hover:border-amber-500 transition-all group">
                        <img src="${rasmUrl}" onclick="changeMainImage('${rasmUrl}')" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    </div>
                `).join('');

                document.getElementById('product-loading').classList.add('hidden');
                document.getElementById('product-content').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('product-loading').innerHTML = `<p class="text-red-500 font-bold">Xatolik: Mahsulot ma'lumotlarini yuklab bo'lmadi.</p>`;
            }
        });

        // Galereyadagi kichik rasmlar bosilganda asosiy rasmni o'zgartirish funksiyasi
        function changeMainImage(url) {
            document.getElementById('mebel-rasm').src = url;
        }

        function orderMebel() {
            const m = document.getElementById('contactModal');
            if(!m) return;
            m.classList.remove('hidden');
            setTimeout(() => m.style.opacity = '1', 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const m = document.getElementById('contactModal');
            if(!m) return;
            m.style.opacity = '0';
            setTimeout(() => {
                m.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        const feedbackForm = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        if (feedbackForm) {
            feedbackForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const name = document.getElementById('msgName').value.trim();
                const phone = document.getElementById('msgPhone').value.trim();
                const message = document.getElementById('msgText').value.trim();

                if (!name || !message || phone === "+998" || phone === "") {
                    alert("⚠️ Iltimos, barcha maydonlarni to'liq to'ldiring!");
                    return; 
                }

                if (phone.length < 13) {
                    alert("⚠️ Iltimos, telefon raqamingizni to'liq kiriting!");
                    return;
                }

                submitBtn.disabled = true;
                btnText.innerText = "Yuborilmoqda...";

                const formData = {
                    name: name,
                    phone: phone,
                    message: message,
                    mebelNomi: joriyMebel ? joriyMebel.nomi : "Batafsil sahifadan so'rov",
                    narxi: joriyMebel ? joriyMebel.narxi : "Kelishilgan",
                    rasmi: joriyMebel ? joriyMebel.rasm : "",
                    status: "Kutilmoqda",
                    date: new Date().toLocaleString('uz-UZ')
                };

                try {
                    const res = await fetch(`${BASE_URL}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (res.ok) {
                        btnText.innerText = "Muvaffaqiyatli!";
                        submitBtn.classList.replace('bg-amber-500', 'bg-green-500');
                        
                        setTimeout(() => {
                            feedbackForm.reset();
                            closeModal();
                            submitBtn.disabled = false;
                            btnText.innerText = "Xabar yuborish";
                            submitBtn.classList.replace('bg-green-500', 'bg-amber-500');
                        }, 2000);
                    } else {
                        throw new Error("Xatolik");
                    }
                } catch (err) {
                    alert("Xatolik yuz berdi. Qayta urinib ko'ring.");
                    submitBtn.disabled = false;
                    btnText.innerText = "Xabar yuborish";
                }
            });
        }
    </script>
</body>
</html>
